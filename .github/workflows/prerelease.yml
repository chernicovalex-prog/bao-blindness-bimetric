name: Research preview build and optional release

on:
  push:
    branches:
      - prerelease/r28-review
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub pre-release after all checks pass
        type: boolean
        default: false
      tag:
        description: Tag for the pre-release
        type: string
        default: r28-review-candidate

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r current/requirements.txt
      - name: Download the public Pantheon+ covariance
        run: bash current/data/download_data.sh
      - name: Focused CMB and independent-background checks
        working-directory: current/src
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 cmb_spec_gates.py
          python3 independent_bg.py
      - name: Full current assertions
        working-directory: current/src
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 checks.py
      - name: Regenerate figures from the declared current results
        working-directory: current/src
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 make_figures.py
          mkdir -p ../01_Statya/figures
          cp ../figures/*.pdf ../01_Statya/figures/
      - name: Build the manuscript
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0
      - name: Compile the manuscript
        working-directory: current/01_Statya
        run: tectonic --keep-intermediates --keep-logs main.tex
      - name: Package PDF, arXiv source and current code/data
        run: python3 current/package_release.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-preview
          path: release/*

  create-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: research-preview
          path: release
      - name: Create the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: The H&M Anchor, Decomposed — research preview
          body_path: current/RELEASE_NOTES.md
          prerelease: true
          files: release/*
